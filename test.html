<!doctype html>
<html lang="ko">
  <head>
    <meta charset="UTF-8" />
    <title>Stay Finder</title>
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="icon" href="data:,">

    <style>
      * {
        box-sizing: border-box;
      }

      body {
        margin: 0;
        font-family: Arial, sans-serif;
        background: #f7f7f7;
      }

      /* HEADER */
      .header {
        background: white;
        padding: 12px 16px;
        border-bottom: 1px solid #eee;
        display: flex;
        justify-content: space-between;
        align-items: center;
        flex-wrap: wrap;
        gap: 10px;
      }

      .logo {
        font-weight: bold;
        font-size: 20px;
        color: #ff5a5f;
      }

      .search-box {
        display: flex;
        gap: 8px;
        background: #fff;
        border: 1px solid #ddd;
        padding: 6px;
        border-radius: 30px;
        flex: 1;
        min-width: 200px;
        max-width: 420px;
      }

      .search-box input {
        border: none;
        outline: none;
        flex: 1;
        min-width: 0;
      }

      .search-btn {
        background: #ff5a5f;
        color: white;
        border: none;
        padding: 6px 12px;
        border-radius: 20px;
        cursor: pointer;
        white-space: nowrap;
      }

      /* HERO */
      .hero {
        padding: 20px 16px;
        text-align: center;
      }

      .hero h1 {
        font-size: 24px;
        margin-bottom: 8px;
      }

      /* LIST */
      .list {
        display: grid;
        grid-template-columns: repeat(auto-fit, minmax(160px, 1fr));
        gap: 16px;
        max-width: 1200px;
        margin: 0 auto;
        padding: 16px;
      }

      .card {
        border-radius: 12px;
        overflow: hidden;
        cursor: pointer;
        background: white;
      }

      .card img {
        width: 100%;
        height: 160px;
        object-fit: cover;
        display: block;
      }

      .card-body {
        padding: 10px;
      }

      .title {
        font-weight: 600;
        font-size: 14px;
      }

      .price {
        color: #ff5a5f;
        margin-top: 5px;
        font-weight: 600;
      }

      /* OVERLAY */
      .overlay {
        position: fixed;
        inset: 0;
        background: rgba(0, 0, 0, 0.5);
        display: flex;
        justify-content: center;
        align-items: center;
        padding: 16px;
      }

      /* MODAL */
      .modal {
        background: white;
        padding: 24px;
        border-radius: 16px;
        width: min(90vw, 360px);
        display: flex;
        flex-direction: column;
        gap: 12px;
      }

      .modal input {
        padding: 14px;
        border: 1px solid #ddd;
        border-radius: 8px;
        width: 100%;
      }

      .login-btn {
        background: #ff5a5f;
        color: white;
        border: none;
        width: 100%;
        padding: 14px;
        border-radius: 10px;
        cursor: pointer;
      }

      .login-btn:hover {
        background: #e0484d;
      }

      .login-btn:disabled {
        background: #ffb3b6;
        cursor: not-allowed;
      }

      .modal-header {
        display: flex;
        flex-direction: column;
        align-items: center;
        gap: 10px;
        margin-bottom: 10px;
      }

      .modal-header h2 {
        margin: 0;
        font-size: 20px;
        text-align: center;
      }

      /* divider */
      .divider {
        display: flex;
        align-items: center;
        text-align: center;
        margin: 10px 0;
        color: #888;
        font-size: 12px;
      }

      .divider::before,
      .divider::after {
        content: "";
        flex: 1;
        border-bottom: 1px solid #ddd;
      }

      .divider span {
        padding: 0 10px;
      }

      /* social login */
      .social-login {
        display: grid;
        grid-template-columns: repeat(3, 1fr);
        gap: 12px;
        justify-items: center;
      }

      .icon-btn {
        display: flex;
        justify-content: center;
        align-items: center;
        height: 56px;
        width: 56px;
        border-radius: 12px;
        border: 1px solid #ddd;
        background: white;
        cursor: pointer;
      }

      .icon-btn img {
        width: 20px;
        height: 20px;
      }

      .icon-btn:hover {
        background: #f5f5f5;
      }

      .icon-btn.apple img {
        filter: invert(1);
      }

      /* 모바일 추가 보정 */
      @media (max-width: 480px) {
        .hero h1 {
          font-size: 20px;
        }

        .search-box {
          width: 100%;
        }

        .header {
          justify-content: center;
        }
      }
    </style>
  </head>

  <body>
    <!-- HEADER -->
    <div class="header">
      <div style="display:flex;align-items:center;gap:8px;">
        <img src="https://cdn.simpleicons.org/airbnb/FF5A5F" width="36" height="36" />
        <div class="logo">airbnb</div>
      </div>

      <div class="search-box">
        <input type="text" placeholder="어디로 여행가세요?" />
        <button class="search-btn">검색</button>
      </div>
    </div>

    <!-- HERO -->
    <div class="hero">
      <h1>특별한 숙소를 찾아보세요</h1>
      <p>전 세계 다양한 숙소를 간편하게 예약하세요</p>
    </div>

    <!-- LIST (내용 그대로 유지) -->
    <div class="list">
      <!-- (기존 카드 전부 그대로 유지됨 - 생략 없이 복사해서 사용 가능) -->
      <div class="card">
        <img src="https://images.unsplash.com/photo-1505691723518-36a5ac3be353" />
        <div class="card-body">
          <div class="title">서울 한강뷰 아파트</div>
          <div class="price">₩170,000 / 박</div>
        </div>
      </div>

      <!-- 나머지 카드들도 그대로 유지 -->
    </div>

    <!-- LOGIN MODAL -->
    <div class="overlay">
      <div class="modal">
        <div class="modal-header">
          <img src="https://cdn.simpleicons.org/airbnb/FF5A5F" width="40" height="40" />
          <h2>로그인 또는 회원가입</h2>
        </div>

        <form onsubmit="return false;">
          <input placeholder="전화번호 또는 이메일" type="text" required />
          <button class="login-btn" type="submit">계속</button>
        </form>

        <div class="divider"><span>또는</span></div>

        <div class="social-login">
          <button class="icon-btn">
            <img src="https://cdn.simpleicons.org/naver/03C75A" />
          </button>
          <button class="icon-btn">
            <img src="https://www.gstatic.com/firebasejs/ui/2.0.0/images/auth/google.svg" />
          </button>
          <button class="icon-btn apple">
            <img src="https://cdn.simpleicons.org/apple/ffffff" />
          </button>
        </div>
      </div>
    </div>
  </body>
</html>
