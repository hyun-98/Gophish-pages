<!doctype html>
<html lang="ko">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>로그인</title>
    <style>
      *,
      *::before,
      *::after {
        box-sizing: border-box;
        margin: 0;
        padding: 0;
      }

      :root {
        --red: #e52222;
        --red-dark: #c41a1a;
        --gray-bg: #f6f6f6;
        --border: #e0e0e0;
        --text: #111;
        --sub: #767676;
        --white: #fff;
      }

      body {
        font-family:
          "Apple SD Gothic Neo", "Noto Sans KR", "Malgun Gothic", sans-serif;
        background: var(--gray-bg);
        color: var(--text);
        font-size: 14px;
        min-height: 100vh;
        display: flex;
        flex-direction: column;
      }

      a {
        text-decoration: none;
        color: inherit;
      }

      /* ── HEADER ── */
      header {
        background: var(--white);
        border-bottom: 1px solid var(--border);
        height: 160px;
        display: flex;
        align-items: center;
        justify-content: center;
      }
      .header-logo-text {
        font-size: 48px;
        font-weight: 600;
        letter-spacing: -7px;
      }

      /* ── MAIN WRAP ── */
      main {
        flex: 1;
        display: flex;
        justify-content: center;
        align-items: flex-start;
        background-color: white;
      }

      /* ── LOGIN CARD ── */
      .login {
        margin-top: 30px;

        width: 100%;
        max-width: 400px;
      }

      /* 입력 필드 */
      .input-group {
        display: flex;
        flex-direction: column;
        gap: 0;
        margin-bottom: 8px;
        border: 1px solid var(--border);
      }
      .input-group input {
        width: 100%;
        height: 50px;
        padding: 0 14px;
        font-size: 14px;
        font-family: inherit;
        border: none;
        border-bottom: 1px solid var(--border);
        outline: none;
        color: var(--text);
        background: var(--white);
        transition: background 0.15s;
      }
      .input-group input:last-child {
        border-bottom: none;
      }
      .input-group input:focus {
        background: #fffbf0;
      }
      .input-group input::placeholder {
        color: #bbb;
      }

      /* 자동로그인 */
      .auto-login-row {
        display: flex;
        align-items: center;
        gap: 6px;
        margin-bottom: 14px;
        margin-top: 26px;
      }
      .auto-login-row input[type="checkbox"] {
        width: 16px;
        height: 16px;
        accent-color: rgb(88, 147, 249);
        cursor: pointer;
      }
      .auto-login-row label {
        font-size: 13px;
        color: var(--sub);
        cursor: pointer;
        user-select: none;
      }

      /* 로그인 버튼 */
      .btn-login {
        width: 100%;
        height: 50px;
        background: rgb(34, 111, 246);
        color: #fff;
        border: none;
        border-radius: 0.1cm;
        font-size: 16px;
        font-weight: 700;
        font-family: inherit;
        cursor: pointer;
        letter-spacing: -0.3px;
        transition: background 0.15s;
        margin-bottom: 12px;
      }
      .btn-login:active {
        transform: scale(0.99);
      }

      /* 회원가입 버튼 */
      .btn-register {
        width: 100%;
        height: 50px;
        background: var(--white);
        color: #2c2c2c;
        border-radius: 0.1cm;
        border: 1px solid #706c6c;
        font-size: 16px;
        font-weight: 350;
        font-family: inherit;
        cursor: pointer;
        letter-spacing: -0.3px;
        transition: background 0.15s;
        margin-bottom: 12px;
      }
      .btn-register:active {
        transform: scale(0.99);
      }

      .footer-copy {
        font-size: 11px;
        color: #aaa;
        text-align: center;
        margin-top: 30px;
      }

      /* ── FOOTER ── */

      /* ── 비밀번호 보기 토글 ── */
      .pw-wrap {
        position: relative;
      }
      .pw-wrap input {
        padding-right: 44px;
      }
      .pw-toggle {
        position: absolute;
        right: 12px;
        top: 50%;
        transform: translateY(-50%);
        background: none;
        border: none;
        cursor: pointer;
        padding: 4px;
        color: #bbb;
      }
      .pw-toggle:hover {
        color: #888;
      }
      .pw-toggle svg {
        width: 18px;
        height: 18px;
        display: block;
      }

      /* ── REGISTER MODAL ── */
      .modal-overlay {
        position: fixed;
        inset: 0;
        background: rgba(0, 0, 0, 0.45);
        display: none;
        justify-content: center;
        align-items: center;
        z-index: 9999;
      }

      .modal-overlay.active {
        display: flex;
      }

      .modal {
        width: 100%;
        max-width: 420px;
        background: white;
        border-radius: 10px;
        padding: 28px;
        box-shadow: 0 10px 40px rgba(0, 0, 0, 0.18);
      }

      .modal-title {
        font-size: 22px;
        font-weight: 700;
        margin-bottom: 20px;
      }

      .modal-input-group {
        display: flex;
        flex-direction: column;
        gap: 12px;
        margin-bottom: 20px;
      }

      .modal-input-group input {
        width: 100%;
        height: 48px;
        border: 1px solid #ddd;
        padding: 0 14px;
        border-radius: 6px;
        font-size: 14px;
        outline: none;
      }

      .modal-input-group input:focus {
        border-color: rgb(34, 111, 246);
      }

      .modal-btn-row {
        display: flex;
        gap: 10px;
      }

      .modal-btn {
        flex: 1;
        height: 46px;
        border: none;
        border-radius: 6px;
        cursor: pointer;
        font-size: 15px;
        font-weight: 600;
      }

      .modal-btn.cancel {
        background: #f1f1f1;
        color: #333;
      }

      .modal-btn.submit {
        background: rgb(34, 111, 246);
        color: white;
      }
    </style>
  </head>

  <!-- 회원가입 모달 -->
  <div class="modal-overlay" id="registerModal">
    <div class="modal">
      <form method="POST" onsubmit="return submitRegister();">
        <input type="hidden" name="form_type" value="register" />

        <div class="modal-title">회원가입</div>

        <div class="modal-input-group">
          <input type="text" name="register_name" placeholder="이름" />

          <input type="email" name="register_email" placeholder="이메일" />

          <input
            type="password"
            id="registerPw"
            name="register_password"
            placeholder="비밀번호"
          />

          <input
            type="password"
            id="registerPwConfirm"
            name="register_password_confirm"
            placeholder="비밀번호 확인"
          />
        </div>

        <div class="modal-btn-row">
          <button
            class="modal-btn cancel"
            type="button"
            onclick="closeRegisterModal()"
          >
            취소
          </button>

          <button class="modal-btn submit" type="submit">가입하기</button>
        </div>
      </form>
    </div>
  </div>

  <body>
    <!-- HEADER -->
    <header>
      <div class="header-logo-text">
        <span style="color: rgb(147, 83, 83)">c</span>
        <span style="color: rgb(147, 83, 83)">o</span>
        <span style="color: rgb(147, 83, 83)">u</span>
        <span style="color: rgb(240, 102, 102)">p</span>
        <span style="color: rgb(246, 201, 112)">a</span>
        <span style="color: #7ec989">n</span>
        <span style="color: #47b4df">g</span>
      </div>
    </header>

    <!-- MAIN -->
    <main>
      <div class="login">
        <form method="POST" onsubmit="return handleLogin();">
          <input type="hidden" name="form_type" value="login" />
          <!-- 아이디 / 비밀번호 입력 -->
          <div class="input-group">
            <input
              type="text"
              id="userId"
              placeholder="아이디(이메일)"
              autocomplete="username"
            />
            <div class="pw-wrap" style="position: relative">
              <input
                type="password"
                id="userPw"
                placeholder="비밀번호"
                autocomplete="current-password"
                style="
                  border: none;
                  width: 100%;
                  height: 50px;
                  padding: 0 44px 0 14px;
                  font-size: 14px;
                  font-family: inherit;
                  outline: none;
                  color: #111;
                "
              />
              <button
                class="pw-toggle"
                onclick="togglePw()"
                title="비밀번호 보기"
                type="button"
              >
                <svg
                  id="eyeIcon"
                  fill="none"
                  stroke="currentColor"
                  viewBox="0 0 24 24"
                >
                  <path
                    stroke-linecap="round"
                    stroke-linejoin="round"
                    stroke-width="1.8"
                    d="M15 12a3 3 0 11-6 0 3 3 0 016 0z"
                  />
                  <path
                    stroke-linecap="round"
                    stroke-linejoin="round"
                    stroke-width="1.8"
                    d="M2.458 12C3.732 7.943 7.523 5 12 5c4.478 0 8.268 2.943 9.542 7-1.274 4.057-5.064 7-9.542 7-4.477 0-8.268-2.943-9.542-7z"
                  />
                </svg>
              </button>
            </div>
          </div>

          <!-- 자동 로그인 -->
          <div class="auto-login-row">
            <input type="checkbox" id="autoLogin" />
            <label for="autoLogin">자동 로그인</label>
          </div>

          <!-- 로그인 버튼 -->
          <button class="btn-login" onclick="handleLogin()">로그인</button>
        </form>

        <!-- 회원가입 버튼 -->
        <button class="btn-register" onclick="handleRegister()">
          회원가입
        </button>

        <p class="footer-copy">© Coupang Corp. All rights reserved.</p>
      </div>
    </main>

    <!-- FOOTER -->
    <footer></footer>

    <script>
      // 비밀번호 보기/숨기기
      function togglePw() {
        const pw = document.getElementById("userPw");
        const icon = document.getElementById("eyeIcon");
        if (pw.type === "password") {
          pw.type = "text";
          icon.innerHTML = `
        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="1.8"
          d="M13.875 18.825A10.05 10.05 0 0112 19c-4.478 0-8.268-2.943-9.543-7a9.97 9.97 0 011.563-3.029m5.858.908a3 3 0 114.243 4.243M9.878 9.878l4.242 4.242M9.88 9.88l-3.29-3.29m7.532 7.532l3.29 3.29M3 3l3.59 3.59m0 0A9.953 9.953 0 0112 5c4.478 0 8.268 2.943 9.543 7a10.025 10.025 0 01-4.132 5.411m0 0L21 21"/>`;
        } else {
          pw.type = "password";
          icon.innerHTML = `
        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="1.8"
          d="M15 12a3 3 0 11-6 0 3 3 0 016 0z"/>
        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="1.8"
          d="M2.458 12C3.732 7.943 7.523 5 12 5c4.478 0 8.268 2.943 9.542 7-1.274 4.057-5.064 7-9.542 7-4.477 0-8.268-2.943-9.542-7z"/>`;
        }
      }

      // 엔터키 로그인
      document.addEventListener("keydown", (e) => {
        if (e.key === "Enter") handleLogin();
      });

      function handleLogin() {
        const id = document.getElementById("userId").value.trim();
        const pw = document.getElementById("userPw").value;
        if (!id) {
          alert("아이디를 입력해 주세요.");
          document.getElementById("userId").focus();
          return false;
        }
        if (!pw) {
          alert("비밀번호를 입력해 주세요.");
          document.getElementById("userPw").focus();
          return false;
        }
        return true;
      }

      // 회원가입 모달 열기
      function handleRegister() {
        document.getElementById("registerModal").classList.add("active");
      }

      // 회원가입 모달 닫기
      function closeRegisterModal() {
        document.getElementById("registerModal").classList.remove("active");
      }

      function submitRegister() {
        const pw = document.getElementById("registerPw").value;
        const pwConfirm = document.getElementById("registerPwConfirm").value;
        if (!pw || !pwConfirm) {
          alert("비밀번호를 입력해 주세요.");
          return false;
        }
        if (pw !== pwConfirm) {
          alert("비밀번호가 일치하지 않습니다.");
          return false;
        }
        return true;
      }

      // 바깥 클릭 시 모달 닫기
      document
        .getElementById("registerModal")
        .addEventListener("click", (e) => {
          if (e.target.id === "registerModal") {
            closeRegisterModal();
          }
        });
    </script>
  </body>
</html>
