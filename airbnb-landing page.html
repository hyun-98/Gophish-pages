<!doctype html>
<html lang="ko">
  <head>
    <meta charset="UTF-8" />
    <title>Stay Finder</title>
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />

    <style>
      body {
        margin: 0;
        font-family: Arial, sans-serif;
        background: #f7f7f7;
      }

      /* HEADER */
      .header {
        background: white;
        padding: 15px 30px;
        border-bottom: 1px solid #eee;
        display: flex;
        justify-content: space-between;
        align-items: center;
      }

      .logo {
        font-weight: bold;
        font-size: 20px;
        color: #ff5a5f;
      }

      .search-box {
        display: flex;
        gap: 10px;
        background: #fff;
        border: 1px solid #ddd;
        padding: 8px;
        border-radius: 30px;
      }

      .search-box input {
        border: none;
        outline: none;
      }

      .search-btn {
        background: #ff5a5f;
        color: white;
        border: none;
        padding: 8px 16px;
        border-radius: 20px;
        cursor: pointer;
      }

      /* HERO */
      .hero {
        padding: 40px;
        text-align: center;
      }

      .hero h1 {
        font-size: 28px;
        margin-bottom: 10px;
      }

      /* LIST */
      .list {
        display: grid;
        grid-template-columns: repeat(auto-fill, minmax(250px, 1fr));
        gap: 20px;
        padding: 30px;
      }

      .card {
        background: white;
        border-radius: 12px;
        overflow: hidden;
        box-shadow: 0 2px 6px rgba(0, 0, 0, 0.1);
      }

      .card img {
        width: 100%;
        height: 180px;
        object-fit: cover;
      }

      .card-body {
        padding: 15px;
      }

      .title {
        font-weight: bold;
        font-size: 14px;
      }

      .price {
        color: #ff5a5f;
        margin-top: 5px;
      }
    </style>
  </head>

  <body>
    <!-- HEADER -->
    <div
      class="header"
      style="display: flex; align-items: center; padding: 10px 20px"
    >
      <!-- 왼쪽 (로고) -->
      <div style="display: flex; align-items: center; gap: 8px">
        <img
          src="https://cdn.simpleicons.org/airbnb/FF5A5F"
          width="40"
          height="40"
        />
        <div style="font-weight: bold; font-size: 18px; color: ff5a5f;">airbnb</div>
      </div>

      <!-- 오른쪽으로 밀기 -->
      <div style="margin-left: auto">
        <div class="search-box" style="display: flex; gap: 8px">
          <input
            type="text"
            placeholder="어디로 여행가세요?"
            style="padding: 6px; border: 1px solid #ddd; border-radius: 20px"
          />
          <button
            style="
              background: #ff5a5f;
              color: white;
              border: none;
              padding: 6px 12px;
              border-radius: 20px;
            "
          >
            검색
          </button>
        </div>
      </div>
    </div>

    <!-- HERO -->
    <div class="hero">
      <h1>특별한 숙소를 찾아보세요</h1>
      <p>전 세계 다양한 숙소를 간편하게 예약하세요</p>
    </div>

    <!-- LIST -->
    <div class="list">
      <div class="card">
        <img
          src="https://images.unsplash.com/photo-1505691938895-1758d7feb511"
        />
        <div class="card-body">
          <div class="title">서울 아늑한 숙소</div>
          <div class="price">₩120,000 / 박</div>
        </div>
      </div>

      <div class="card">
        <img
          src="https://images.unsplash.com/photo-1493809842364-78817add7ffb"
        />
        <div class="card-body">
          <div class="title">부산 바다뷰 아파트</div>
          <div class="price">₩150,000 / 박</div>
        </div>
      </div>

      <div class="card">
        <img
          src="https://images.unsplash.com/photo-1522708323590-d24dbb6b0267"
        />
        <div class="card-body">
          <div class="title">제주 감성 하우스</div>
          <div class="price">₩180,000 / 박</div>
        </div>
      </div>
    </div>
  </body>
</html>
