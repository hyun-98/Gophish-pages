<!doctype html>
<html lang="ko">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>털린 내 정보 찾기</title>
    <style>
      /* ─── 전역 초기화: 모든 요소의 기본 margin, padding 제거 및 box-sizing 통일 ─── */
      *,
      *::before,
      *::after {
        box-sizing: border-box;
        margin: 0;
        padding: 0;
      }

      /* ─── CSS 커스텀 변수 (디자인 토큰): 공공기관 스타일의 파란 계열 브랜드 색상 정의 ─── */
      :root {
        --blue: #0058a3;        /* 주요 브랜드 파란색 (헤더, 버튼, 팝업 상단 등) */
        --blue-dark: #003d78;   /* 어두운 파란색 (버튼 hover 상태) */
        --blue-mid: #1a72c4;    /* 중간 파란색 (보조 강조) */
        --blue-light: #e8f1fb;  /* 연한 파란색 (하이라이트 박스 배경) */
        --accent: #0099d9;      /* 포인트 색상 (밝은 하늘색) */
        --gray: #555;           /* 중간 회색 텍스트 */
        --gray-light: #f5f7fa;  /* 연한 회색 배경 */
        --border: #dce3ec;      /* 테두리 색상 */
        --white: #fff;          /* 흰색 */
        --text: #222;           /* 주요 텍스트 색상 */
      }

      /* ─── body 기본 스타일 ─── */
      body {
        font-family:
          "Apple SD Gothic Neo", "Noto Sans KR", "Malgun Gothic", sans-serif;
          /* 폰트 우선순위: Mac → 한국어 → Windows → 기본 sans-serif */
        color: var(--text);
        background: var(--white);
        font-size: 15px;
      }

      /* a 태그 기본 밑줄·색상 제거 */
      a {
        text-decoration: none;
        color: inherit;
      }
      /* ul 불릿 제거 */
      ul {
        list-style: none;
      }

      /* ===== HEADER ===== */
      /*
        헤더 배경 이미지 전체 너비 레이아웃
        - 실제 HTML 태그(<nav>, <a> 등) 없이 이미지 한 장으로 헤더 전체를 표현하는 구조
        - position: relative + overflow: hidden으로 이미지가 영역 밖으로 삐져나오지 않게 처리
        - background-size: cover + background-position: center로 어떤 화면 너비에서도
          이미지가 영역을 꽉 채우도록 설정
      */
      .header-overlay {
        position: relative;

        width: 100%;
        height: 70px;      /* 헤더 고정 높이 */

        overflow: hidden;

        display: flex;
        align-items: center;

        background-image: url("images/kidc-image-landing/kidc-header.png");

        background-size: cover;
        background-position: center;
        background-repeat: no-repeat;
      }

      /* ── HERO ── */
      /*
        히어로 배경 이미지 섹션
        - 페이지 최상단의 대형 비주얼 영역 (880px 고정 높이)
        - 헤더와 동일하게 배경 이미지 한 장으로 전체 구성
      */
      .hero {
        position: relative;

        width: 100%;
        height: 880px;     /* 히어로 대형 비주얼 고정 높이 */

        overflow: hidden;

        display: flex;
        align-items: center;

        background-image: url("images/kidc-image-landing/kidc-hero.png");

        background-size: cover;
        background-position: center;
        background-repeat: no-repeat;
      }

      /* ── MAIN ── */
      /*
        메인 콘텐츠 구역 1~3: 각각 별도 이미지로 구성된 섹션
        - 텍스트/버튼 등의 실제 HTML 요소 없이 이미지로만 콘텐츠 표현
        - 이미지 교체만으로 콘텐츠 수정이 가능하나, 접근성(스크린리더 등)에 취약한 구조
      */

      /* 메인 섹션 1: 550px 높이 */
      .main1-overlay {
        position: relative;

        width: 100%;
        height: 550px;

        overflow: hidden;

        display: flex;
        align-items: center;

        background-image: url("images/kidc-image-landing/kidc-main1.png");

        background-size: cover;
        background-position: center;
        background-repeat: no-repeat;
      }

      /* 메인 섹션 2: 500px 높이, margin-top: 20px으로 섹션 1과 간격 추가 */
      .main2-overlay {
        position: relative;

        width: 100%;
        height: 500px;
        margin-top: 20px;  /* 섹션 1과의 구분 여백 (다른 섹션에는 없는 예외적 여백) */

        overflow: hidden;

        display: flex;
        align-items: center;

        background-image: url("images/kidc-image-landing/kidc-main2.png");

        background-size: cover;
        background-position: center;
        background-repeat: no-repeat;
      }

      /* 메인 섹션 3: 500px 높이 */
      .main3-overlay {
        position: relative;

        width: 100%;
        height: 500px;

        overflow: hidden;

        display: flex;
        align-items: center;

        background-image: url("images/kidc-image-landing/kidc-main3.png");

        background-size: cover;
        background-position: center;
        background-repeat: no-repeat;
      }

      /* ===== FOOTER ===== */
      /*
        푸터: 350px 고정 높이의 배경 이미지 영역
        - 링크, 주소 등 푸터 텍스트 요소 없이 이미지 한 장으로 구성
      */
      footer {
        position: relative;

        width: 100%;
        height: 350px;

        overflow: hidden;

        display: flex;
        align-items: center;

        background-image: url("images/kidc-image-landing/kidc-footer.png");

        background-size: cover;
        background-position: center;
        background-repeat: no-repeat;
      }

      /* ===== POPUP NOTICE ===== */

      /*
        팝업 오버레이: 페이지 로드 시 바로 표시되는 공지/조회 팝업
        - position: fixed + inset: 0으로 화면 전체를 덮는 반투명 검은 배경
        - z-index: 1000으로 모든 페이지 요소 위에 표시
        - flex로 팝업 박스를 화면 정중앙에 배치
        ※ 닫기 버튼이 HTML에 없으므로 현재 팝업을 닫을 수 없는 상태
           (closePopup() 함수는 정의되어 있으나 호출하는 버튼이 없음)
      */
      .popup-overlay {
        position: fixed;
        inset: 0;                         /* top/right/bottom/left: 0 단축 표현 */
        background: rgba(0, 0, 0, 0.5);  /* 50% 투명도의 검은 배경 */
        z-index: 1000;
        display: flex;
        align-items: center;
        justify-content: center;
      }

      /* 팝업 박스: 흰 배경의 580px 너비 카드, 둥근 모서리 + 강한 그림자 */
      .popup {
        background: #fff;
        width: 580px;
        border-radius: 8px;
        overflow: hidden;   /* 헤더 배경색이 border-radius 밖으로 넘치지 않도록 */
        box-shadow: 0 20px 60px rgba(0, 0, 0, 0.3);
      }

      /* 팝업 헤더: 파란 배경 + 흰 텍스트, 제목과 닫기 버튼을 양 끝에 배치 */
      .popup-head {
        background: var(--blue);
        color: #fff;
        padding: 16px 22px;
        display: flex;
        justify-content: space-between; /* 제목(왼쪽)과 닫기 버튼(오른쪽) 양 끝 배치 */
        align-items: center;
      }
      .popup-head h3 {
        font-size: 18px;
        font-weight: 700;
      }

      /* 팝업 본문 영역: 안내 텍스트 + 하이라이트 박스 + 조회 폼 */
      .popup-body {
        padding: 28px 24px;
      }
      .popup-body p {
        font-size: 14px;
        line-height: 1.8;  /* 넉넉한 줄 간격으로 가독성 향상 */
        color: #444;
        margin-bottom: 16px;
      }

      /*
        하이라이트 박스: 연한 파란 배경 + 왼쪽 파란 세로선(border-left)
        - 공공기관 공지 스타일의 강조 블록
        - border-radius: 0 4px 4px 0으로 왼쪽은 직각, 나머지만 둥글게
      */
      .popup-body .highlight {
        background: var(--blue-light);
        border-left: 3px solid var(--blue);  /* 왼쪽 강조 세로선 */
        padding: 12px 16px;
        font-size: 13px;
        color: #333;
        border-radius: 0 4px 4px 0;         /* 왼쪽은 직각(border-left와 맞닿음), 나머지 둥글게 */
        margin-bottom: 16px;
      }

      /*
        팝업 내 조회 폼: input들을 세로로 10px 간격으로 나열
        - margin-top: 16px으로 위 텍스트와 구분
      */
      .popup-body form {
        display: flex;
        flex-direction: column;
        gap: 10px;
        margin-top: 16px;
      }

      /* 조회 폼 input: 포커스 시 파란 테두리 + 연한 파란 glow 효과 */
      .popup-body form input {
        width: 100%;
        padding: 11px 14px;
        border: 1px solid #dce3ec;
        border-radius: 5px;
        font-size: 14px;
        font-family: inherit;
        color: #222;
        outline: none;           /* 브라우저 기본 포커스 외곽선 제거 */
        transition:
          border-color 0.2s,
          box-shadow 0.2s;
      }

      /* 포커스 시: 파란 테두리 + box-shadow로 글로우 효과 */
      .popup-body form input:focus {
        border-color: #0058a3;
        box-shadow: 0 0 0 3px rgba(0, 88, 163, 0.1); /* 파란색 10% 투명도 번짐 */
      }

      .popup-body form input::placeholder {
        color: #aaa;
      }

      /* 조회 버튼: 파란 배경, hover 시 어두운 파란색으로 전환 */
      .login-btn {
        width: 100%;
        padding: 12px;
        background: #0058a3;
        color: #fff;
        border: none;
        border-radius: 5px;
        font-size: 15px;
        font-weight: 700;
        font-family: inherit;
        cursor: pointer;
        margin-top: 4px;
        transition: background 0.2s;
      }

      .login-btn:hover {
        background: #003d78; /* --blue-dark와 동일한 값 (변수 대신 직접 값 사용) */
      }

      /* ─── 스크롤바 커스터마이징 (Chrome/Safari/Edge 전용, Firefox 미지원) ─── */
      ::-webkit-scrollbar {
        width: 6px;           /* 스크롤바 너비 */
      }
      ::-webkit-scrollbar-track {
        background: #f0f0f0;  /* 스크롤바 트랙(배경) 색상 */
      }
      ::-webkit-scrollbar-thumb {
        background: #bbb;     /* 스크롤바 핸들 색상 */
        border-radius: 3px;   /* 핸들 모서리 둥글게 */
      }
    </style>
  </head>
  <body>
    <!-- ═══════════════════════════════ POPUP ═══════════════════════════════ -->
    <!--
      서비스 안내 팝업: 페이지 로드 시 즉시 표시
      - id="popupOverlay": closePopup()에서 display: none 으로 숨김 처리
      ※ 현재 닫기 버튼이 HTML에 존재하지 않아 팝업을 닫을 수 없는 상태
         (closePopup() 함수는 정의되어 있으나 호출 버튼 없음)
    -->
    <div class="popup-overlay" id="popupOverlay">
      <div class="popup">

        <!-- 팝업 헤더: 파란 배경 + "서비스 이용 안내" 제목 -->
        <div class="popup-head">
          <h3>서비스 이용 안내</h3>
        </div>

        <!-- 팝업 본문: 서비스 설명 + 운영 기관 안내 + 조회 폼 -->
        <div class="popup-body">
          <!-- 서비스 소개 텍스트 -->
          <p>
            털린 내 정보 찾기 서비스는 다크웹 등에서 불법 유통되는 계정정보 유출
            여부를 확인할 수 있는 <strong>무료 공식 서비스</strong>입니다.
          </p>

          <!--
            하이라이트 박스: 운영 기관(개인정보보호위원회, KISA) 및
            암호화 처리 안내를 강조 스타일로 표시
          -->
          <div class="highlight">
            ✅ 본 서비스는 <strong>개인정보보호위원회</strong>와
            <strong>한국인터넷진흥원(KISA)</strong>이 공동으로 운영합니다.<br />
            ✅ 입력하신 계정정보는 즉시 암호화(HASH)되어 조회 후 저장되지
            않습니다.
          </div>

          <!-- 유출 확인 후 조치 안내 텍스트 -->
          <p>
            유출 이력이 확인된 경우, 즉시 비밀번호를 변경하여 2차 피해를
            예방하시기 바랍니다.
          </p>

          <!--
            조회 폼: 이름 + 이메일 입력 후 서버로 POST 전송
            - action의 {{token}}은 서버사이드 템플릿 변수 (CSRF 토큰 등에 활용)
            ※ 주의: 이메일 조회 입력 필드의 type이 "email"로 설정되어 있어
               입력값이 이메일 형식으로 검증됨 — 일반적으로 이메일은 type="email"
               또는 type="text"를 사용해야 하나, 보안상 입력값을 숨기려는 의도로 보임
          -->
          <form method="post" action="/submit/{{token}}">
            <!-- 이름 입력: required로 빈 값 제출 방지 -->
            <input placeholder="이름을 입력해 주세요" required="" type="text" />

            <!--
              이메일 입력: name="email"로 설정되어 있으며, 실제로는 이메일(메일 주소) 입력 필드
              type="email"로 설정되어 이메일 형식 검증이 이루어짐
              (브라우저에서 이메일 형식이 아닌 입력에 대해 경고 표시)
            -->
            <input
              name="email"
              placeholder="유출 여부 의심되는 메일 주소를 입력해 주세요"
              required=""
              type="email"
            />

            <!-- 조회 버튼: type="submit"으로 폼 전송 -->
            <button class="login-btn" type="submit">
              메일 유출 여부 조회
            </button>
          </form>
        </div>
      </div>
    </div>

    <!-- ═══════════════════════════════ HEADER ═══════════════════════════════ -->
    <!--
      헤더: 실제 내비게이션 링크 없이 배경 이미지(kidc-header.png) 한 장으로 구성
      - .header-overlay가 CSS background-image로 이미지를 표시
      - 내부 div는 빈 상태 (이미지에 텍스트/링크가 포함된 디자인)
    -->
    <header>
      <div class="header-overlay"></div>
    </header>

    <!-- ═══════════════════════════════ HERO ═══════════════════════════════ -->
    <!--
      히어로 섹션: 880px 높이의 대형 비주얼 영역
      - kidc-hero.png 배경 이미지 한 장으로 전체 표현
      - .hero-overlay 클래스는 CSS에 정의되어 있지 않음 (미사용 클래스)
    -->
    <section class="hero">
      <div class="hero-overlay"></div>
    </section>

    <!-- ═══════════════════════════════ MAIN ═══════════════════════════════ -->
    <!--
      메인 콘텐츠: 3개의 배경 이미지 섹션으로 구성
      - 각 섹션은 CSS background-image로 이미지를 표시하는 빈 div
      - HTML 텍스트/버튼 없이 이미지로만 콘텐츠 표현 (접근성 취약 구조)
    -->
    <main>
      <div class="main1-overlay"></div>  <!-- 메인 섹션 1: 550px -->
      <div class="main2-overlay"></div>  <!-- 메인 섹션 2: 500px + 상단 20px 여백 -->
      <div class="main3-overlay"></div>  <!-- 메인 섹션 3: 500px -->
    </main>

    <!-- ═══════════════════════════════ FOOTER ═══════════════════════════════ -->
    <!--
      푸터: 350px 높이의 배경 이미지 영역
      - kidc-footer.png 한 장으로 구성, 내부 .footer-overlay div는 빈 상태
      ※ CSS에서 footer 태그에 직접 background-image를 적용했으므로
         내부 div(.footer-overlay)는 실질적으로 불필요한 빈 요소
    -->
    <footer>
      <div class="footer-overlay"></div>
    </footer>

    <script>
      /**
       * 팝업 닫기 함수
       * - id="popupOverlay" 요소의 display를 none으로 설정해 팝업 숨김 처리
       * ※ 현재 이 함수를 호출하는 버튼이 HTML에 존재하지 않아 실제로는 실행되지 않음
       *    팝업을 닫으려면 popup-head 영역 등에 onclick="closePopup()" 버튼 추가 필요
       */
      function closePopup() {
        document.getElementById("popupOverlay").style.display = "none";
      }
    </script>
  </body>
</html>
